services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: provenix
      POSTGRES_PASSWORD: provenix
      POSTGRES_DB: provenix
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provenix -d provenix"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://provenix:provenix@db:5432/provenix
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    command: arq app.workers.settings.WorkerSettings --watch /app/app
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://provenix:provenix@db:5432/provenix
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
